<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

{

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// --- SCENE SETUP ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 20000);
camera.position.set(40, 25, 60);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 8;
controls.maxDistance = 500;
controls.target.set(0, 0, 0);

// --- POST-PROCESSING ---
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.5, 0.4, 0.85
);
bloomPass.threshold = 0.2;
bloomPass.strength = 2.0;
bloomPass.radius = 0.8;
composer.addPass(bloomPass);

// --- STARFIELD ---
function createStarfield() {
  const count = 12000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  
  for (let i = 0; i < count; i++) {
    const r = 800 + Math.random() * 4000;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
    
    const temp = Math.random();
    if (temp < 0.3) { colors[i*3] = 0.8; colors[i*3+1] = 0.85; colors[i*3+2] = 1.0; }
    else if (temp < 0.6) { colors[i*3] = 1.0; colors[i*3+1] = 0.95; colors[i*3+2] = 0.8; }
    else { colors[i*3] = 1.0; colors[i*3+1] = 1.0; colors[i*3+2] = 1.0; }
    
    sizes[i] = 0.5 + Math.random() * 2.0;
  }
  
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  
  const material = new THREE.PointsMaterial({
    size: 1.2,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    sizeAttenuation: true
  });
  
  return new THREE.Points(geometry, material);
}
scene.add(createStarfield());

// --- SUN ---
const sunVertexShader = `
  varying vec2 vUv;
  varying vec3 vPosition;
  void main() {
    vUv = uv;
    vPosition = position;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const sunFragmentShader = `
  uniform float uTime;
  varying vec2 vUv;
  varying vec3 vPosition;
  
  // Simplex noise
  vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
  vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
  vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
  vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
  
  float snoise(vec3 v) {
    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
    vec3 i = floor(v + dot(v, C.yyy));
    vec3 x0 = v - i + dot(i, C.xxx);
    vec3 g = step(x0.yzx, x0.xyz);
    vec3 l = 1.0 - g;
    vec3 i1 = min(g.xyz, l.zxy);
    vec3 i2 = max(g.xyz, l.zxy);
    vec3 x1 = x0 - i1 + C.xxx;
    vec3 x2 = x0 - i2 + C.yyy;
    vec3 x3 = x0 - D.yyy;
    i = mod289(i);
    vec4 p = permute(permute(permute(
      i.z + vec4(0.0, i1.z, i2.z, 1.0))
      + i.y + vec4(0.0, i1.y, i2.y, 1.0))
      + i.x + vec4(0.0, i1.x, i2.x, 1.0));
    float n_ = 0.142857142857;
    vec3 ns = n_ * D.wyz - D.xzx;
    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
    vec4 x_ = floor(j * ns.z);
    vec4 y_ = floor(j - 7.0 * x_);
    vec4 x = x_ * ns.x + ns.yyyy;
    vec4 y = y_ * ns.x + ns.yyyy;
    vec4 h = 1.0 - abs(x) - abs(y);
    vec4 b0 = vec4(x.xy, y.xy);
    vec4 b1 = vec4(x.zw, y.zw);
    vec4 s0 = floor(b0)*2.0 + 1.0;
    vec4 s1 = floor(b1)*2.0 + 1.0;
    vec4 sh = -step(h, vec4(0.0));
    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
    vec3 p0 = vec3(a0.xy, h.x);
    vec3 p1 = vec3(a0.zw, h.y);
    vec3 p2 = vec3(a1.xy, h.z);
    vec3 p3 = vec3(a1.zw, h.w);
    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
    m = m * m;
    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
  }
  
  float fbm(vec3 p) {
    float value = 0.0;
    float amplitude = 0.5;
    float frequency = 1.0;
    for (int i = 0; i < 6; i++) {
      value += amplitude * snoise(p * frequency);
      amplitude *= 0.5;
      frequency *= 2.0;
    }
    return value;
  }
  
  void main() {
    vec3 pos = normalize(vPosition);
    float t = uTime * 0.15;
    
    float n1 = fbm(pos * 3.0 + t * 0.5);
    float n2 = fbm(pos * 5.0 - t * 0.3 + 100.0);
    float n3 = fbm(pos * 8.0 + t * 0.7 + 200.0);
    
    float noise = n1 * 0.5 + n2 * 0.3 + n3 * 0.2;
    noise = noise * 0.5 + 0.5;
    
    // Sun colors
    vec3 core = vec3(1.0, 0.95, 0.8);
    vec3 mid = vec3(1.0, 0.6, 0.1);
    vec3 edge = vec3(0.9, 0.2, 0.0);
    vec3 dark = vec3(0.5, 0.1, 0.0);
    
    vec3 color;
    if (noise > 0.65) color = mix(mid, core, (noise - 0.65) / 0.35);
    else if (noise > 0.4) color = mix(edge, mid, (noise - 0.4) / 0.25);
    else color = mix(dark, edge, noise / 0.4);
    
    // Pulsation
    float pulse = sin(uTime * 2.0) * 0.05 + 1.0;
    color *= pulse;
    
    // Sunspots
    float spots = snoise(pos * 12.0 + t * 0.1);
    if (spots > 0.6) {
      color *= mix(1.0, 0.3, (spots - 0.6) / 0.4);
    }
    
    gl_FragColor = vec4(color * 1.5, 1.0);
  }
`;

const sunCoronaVertexShader = `
  varying vec2 vUv;
  varying vec3 vNormal;
  varying vec3 vViewDir;
  void main() {
    vUv = uv;
    vNormal = normalize(normalMatrix * normal);
    vec4 worldPos = modelViewMatrix * vec4(position, 1.0);
    vViewDir = normalize(-worldPos.xyz);
    gl_Position = projectionMatrix * worldPos;
  }
`;

const sunCoronaFragmentShader = `
  uniform float uTime;
  varying vec2 vUv;
  varying vec3 vNormal;
  varying vec3 vViewDir;
  
  void main() {
    float fresnel = 1.0 - dot(vNormal, vViewDir);
    fresnel = pow(fresnel, 3.0);
    
    float flicker = sin(uTime * 3.0 + vUv.y * 20.0) * 0.1 + 
                    sin(uTime * 5.0 + vUv.x * 15.0) * 0.05;
    
    vec3 color = mix(
      vec3(1.0, 0.4, 0.0),
      vec3(1.0, 0.8, 0.2),
      fresnel
    );
    
    float alpha = fresnel * (0.8 + flicker);
    alpha = clamp(alpha, 0.0, 1.0);
    
    gl_FragColor = vec4(color * 2.0, alpha);
  }
`;

// Sun sphere
const sunGeometry = new THREE.SphereGeometry(5, 64, 64);
const sunMaterial = new THREE.ShaderMaterial({
  vertexShader: sunVertexShader,
  fragmentShader: sunFragmentShader,
  uniforms: { uTime: { value: 0 } }
});
const sun = new THREE.Mesh(sunGeometry, sunMaterial);
scene.add(sun);

// Sun corona glow
const coronaGeometry = new THREE.SphereGeometry(6.5, 64, 64);
const coronaMaterial = new THREE.ShaderMaterial({
  vertexShader: sunCoronaVertexShader,
  fragmentShader: sunCoronaFragmentShader,
  uniforms: { uTime: { value: 0 } },
  transparent: true,
  side: THREE.FrontSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const corona = new THREE.Mesh(coronaGeometry, coronaMaterial);
scene.add(corona);

// Second corona layer (bigger, subtler)
const corona2Geometry = new THREE.SphereGeometry(8.0, 48, 48);
const corona2Material = new THREE.ShaderMaterial({
  vertexShader: sunCoronaVertexShader,
  fragmentShader: sunCoronaFragmentShader,
  uniforms: { uTime: { value: 0 } },
  transparent: true,
  side: THREE.FrontSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
corona2Material.uniforms.uTime = coronaMaterial.uniforms.uTime;
const corona2 = new THREE.Mesh(corona2Geometry, corona2Material);
corona2.material.opacity = 0.4;
scene.add(corona2);

// Sun point light
const sunLight = new THREE.PointLight(0xffdd88, 3, 1000);
scene.add(sunLight);
const ambientLight = new THREE.AmbientLight(0x404060, 0.3);
scene.add(ambientLight);

// --- PLANET DATA ---
const planetData = [
  {

    radius: 0.4, distance: 10, speed: 4.15, color: 0xb5a7a7,

    textureUrl: 'https://www.solarsystemscope.com/textures/download/2k_mercury.jpg'
  },
  {

    tilt: 2.64, moons: 0, diameter: '12 104 км', dayLength: '243 дня',
    yearLength: '225 дней', temp: '464°C',
    desc: 'Самая горячая планета из-за парникового эффекта. Вращается в обратную сторону.',
    textureUrl: 'https://www.solarsystemscope.com/textures/download/2k_venus_surface.jpg'
  },
  {
    name: 'Земля', nameEn: 'Earth', type: 'Каменистая планета',
    radius: 1.0, distance: 19, speed: 1.0, color: 0x4488ff,
    tilt: 0.41, moons: 1, diameter: '12 742 км', dayLength: '24 часа',
    yearLength: '365 дней', temp: '15°C',
    desc: 'Единственная известная планета с жизнью. 71% поверхности покрыт водой.',
    textureUrl: 'https://www.solarsystemscope.com/textures/download/2k_earth_daymap.jpg',
    hasAtmosphere: true
  },
  {
    name: 'Марс', nameEn: 'Mars', type: 'Каменистая планета',
    radius: 0.55, distance: 25, speed: 0.53, color: 0xcc5533,
    tilt: 0.44, moons: 2, diameter: '6 779 км', dayLength: '24.6 часа',
    yearLength: '687 дней', temp: '-65°C',
    desc: 'Красная планета. Имеет самую высокую гору в Солнечной системе: Олимп (21 км).',
    textureUrl: 'https://www.solarsystemscope.com/textures/download/2k_mars.jpg'

// --- CREATE PLANETS ---
const textureLoader = new THREE.TextureLoader();
textureLoader.crossOrigin = 'anonymous';
const planets = [];
const planetMeshes = [];
const orbitLines = [];

planetData.forEach((data, index) => {
  const group = new THREE.Group();
  
  // Planet mesh
  const geometry = new THREE.SphereGeometry(data.radius, 48, 48);
  let material;
  
  // Try loading texture, fallback to color
  const fallbackMaterial = new THREE.MeshStandardMaterial({
    color: data.color,
    metalness: 0.1,
    roughness: 0.7
  });
  
  material = fallbackMaterial;
  
  // Attempt texture load
  textureLoader.load(
    data.textureUrl,
    (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;
      mesh.material = new THREE.MeshStandardMaterial({
        map: texture,
        metalness: 0.05,
        roughness: 0.8
      });
    },
    undefined,
    () => {} // Silent fail, keep fallback
  );
  
  const mesh = new THREE.Mesh(geometry, material);
  mesh.rotation.z = data.tilt;
  mesh.castShadow = true;
  group.add(mesh);
  
  // Atmosphere for Earth
  if (data.hasAtmosphere) {
    const atmosGeometry = new THREE.SphereGeometry(data.radius * 1.15, 48, 48);
    const atmosMaterial = new THREE.ShaderMaterial({
      vertexShader: sunCoronaVertexShader,
      fragmentShader: `
        varying vec3 vNormal;
        varying vec3 vViewDir;
        void main() {
          float fresnel = 1.0 - max(dot(vNormal, vViewDir), 0.0);
          fresnel = pow(fresnel, 4.0);
          vec3 color = vec3(0.3, 0.6, 1.0);
          gl_FragColor = vec4(color, fresnel * 0.6);
        }
      `,
      uniforms: {},
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.FrontSide
    });
    const atmosphere = new THREE.Mesh(atmosGeometry, atmosMaterial);
    group.add(atmosphere);
  }
  
  // Saturn rings
  if (data.hasRings) {
    const ringCount = 15000;
    const ringPositions = new Float32Array(ringCount * 3);
    const ringColors = new Float32Array(ringCount * 3);
    const ringSizes = new Float32Array(ringCount);
    
    for (let i = 0; i < ringCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = data.radius * 1.5 + Math.random() * data.radius * 2.5;
      
      // Create gaps (Cassini division style)
      const gap1 = data.radius * 2.3;
      const gapWidth = data.radius * 0.15;
      const dist = Math.abs(r - gap1);
      if (dist < gapWidth && Math.random() > 0.1) continue;
      
      ringPositions[i * 3] = Math.cos(angle) * r;
      ringPositions[i * 3 + 1] = (Math.random() - 0.5) * 0.15;
      ringPositions[i * 3 + 2] = Math.sin(angle) * r;
      
      // Color gradient
      const t = (r - data.radius * 1.5) / (data.radius * 2.5);
      const brightness = 0.5 + (1 - Math.abs(t - 0.4)) * 0.5;
      ringColors[i * 3] = brightness * 0.9;
      ringColors[i * 3 + 1] = brightness * 0.8;
      ringColors[i * 3 + 2] = brightness * 0.6;
      
      ringSizes[i] = 0.03 + Math.random() * 0.06;
    }
    
    const ringGeometry = new THREE.BufferGeometry();
    ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
    ringGeometry.setAttribute('color', new THREE.BufferAttribute(ringColors, 3));
    ringGeometry.setAttribute('size', new THREE.BufferAttribute(ringSizes, 1));
    
    const ringMaterial = new THREE.PointsMaterial({
      size: 0.08,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      sizeAttenuation: true,
      blending: THREE.NormalBlending
    });
    
    const rings = new THREE.Points(ringGeometry, ringMaterial);
    rings.rotation.x = Math.PI * 0.45;
    group.add(rings);
  }
  
  // Position
  const angle = Math.random() * Math.PI * 2;
  group.position.x = Math.cos(angle) * data.distance;
  group.position.z = Math.sin(angle) * data.distance;
  
  scene.add(group);
  planets.push({ group, mesh, data, angle, orbitAngle: angle });
  planetMeshes.push(mesh);
  
  // Orbit line
  const orbitPoints = [];
  for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    orbitPoints.push(new THREE.Vector3(
      Math.cos(a) * data.distance,
      0,
      Math.sin(a) * data.distance
    ));
  }
  const orbitGeometry = new THREE.BufferGeometry().setFromPoints(orbitPoints);
  const orbitLine = new THREE.Line(orbitGeometry, new THREE.LineBasicMaterial({
    color: 0x334466,
    transparent: true,
    opacity: 0.3
  }));
  scene.add(orbitLine);
  orbitLines.push(orbitLine);
});

// --- ASTEROID BELT ---
function createAsteroidBelt() {
  const count = 4000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 32 + Math.random() * 8; // Between Mars and Jupiter
    const y = (Math.random() - 0.5) * 2;
    
    positions[i * 3] = Math.cos(angle) * r;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = Math.sin(angle) * r;
    
    const brightness = 0.3 + Math.random() * 0.3;
    colors[i * 3] = brightness;
    colors[i * 3 + 1] = brightness * 0.9;
    colors[i * 3 + 2] = brightness * 0.8;
    
    sizes[i] = 0.05 + Math.random() * 0.15;
  }
  
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  const material = new THREE.PointsMaterial({
    size: 0.15,
    vertexColors: true,
    transparent: true,
    opacity: 0.7,
    sizeAttenuation: true
  });
  
  return new THREE.Points(geometry, material);
}
const asteroidBelt = createAsteroidBelt();
scene.add(asteroidBelt);

// --- KUIPER BELT ---
function createKuiperBelt() {
  const count = 3000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 100 + Math.random() * 40;
    const y = (Math.random() - 0.5) * 6;
    
    positions[i * 3] = Math.cos(angle) * r;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = Math.sin(angle) * r;
    
    const brightness = 0.15 + Math.random() * 0.15;
    colors[i * 3] = brightness;
    colors[i * 3 + 1] = brightness;
    colors[i * 3 + 2] = brightness * 1.2;
  }
  
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  const material = new THREE.PointsMaterial({
    size: 0.2,
    vertexColors: true,
    transparent: true,
    opacity: 0.5,
    sizeAttenuation: true
  });
  
  return new THREE.Points(geometry, material);
}
scene.add(createKuiperBelt());

// --- RAYCASTER ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  
  const meshes = planets.map(p => p.mesh);
  const intersects = raycaster.intersectObjects(meshes);
  
  if (intersects.length > 0) {
    const idx = meshes.indexOf(intersects[0].object);
    if (idx !== -1) {
      selectedPlanet = planets[idx];
      showInfo(selectedPlanet.data);
      
      // Smooth camera focus
      const target = selectedPlanet.group.position.clone();
      const distance = selectedPlanet.data.radius * 6;
      const camTarget = target.clone().add(new THREE.Vector3(distance, distance * 0.5, distance));
      
      // Animate camera
      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();
      let t = 0;
      
      function animateCamera() {
        t += 0.02;
        if (t >= 1) {
          camera.position.copy(camTarget);
          controls.target.copy(target);
          controls.update();
          return;
        }
        const eased = 1 - Math.pow(1 - t, 4);
        camera.position.lerpVectors(startPos, camTarget, eased);
        controls.target.lerpVectors(startTarget, target, eased);
        controls.update();
        requestAnimationFrame(animateCamera);
      }
      animateCamera();
    }
  }
});

      moons: 8, tilt: 0.13,

    });

});

// --- ANIMATION LOOP ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  const elapsed = clock.getElapsedTime();
  const delta = clock.getDelta();
  
  // Update sun shader
  sunMaterial.uniforms.uTime.value = elapsed;
  coronaMaterial.uniforms.uTime.value = elapsed;
  
  // Rotate sun
  sun.rotation.y = elapsed * 0.05;
  
  // Move planets
  planets.forEach((planet) => {
    planet.orbitAngle += planet.data.speed * 0.002 * simulationSpeed;
    planet.group.position.x = Math.cos(planet.orbitAngle) * planet.data.distance;
    planet.group.position.z = Math.sin(planet.orbitAngle) * planet.data.distance;
    
    // Self rotation
    planet.mesh.rotation.y += 0.01 * simulationSpeed;
  });
  
  // Rotate asteroid belt slowly
  asteroidBelt.rotation.y += 0.0001 * simulationSpeed;
  
  // Update labels
  planets.forEach((planet, i) => {
    if (!showLabels) {
      labelElements[i].classList.remove('visible');
      return;
    }
    
    const pos = planet.group.position.clone();
    pos.y += planet.data.radius + 0.8;
    pos.project(camera);
    
    const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-pos.y * 0.5 + 0.5) * window.innerHeight;
    
    if (pos.z < 1) {
      labelElements[i].style.left = x + 'px';
      labelElements[i].style.top = y + 'px';
      labelElements[i].classList.add('visible');
    } else {
      labelElements[i].classList.remove('visible');
    }
  });
  
  controls.update();
  composer.render();
}

animate();

  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
